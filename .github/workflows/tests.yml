name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  optimizer:
    name: optimizer (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install ".[test]" --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Test
        run: pytest -q
      - name: Quickstart
        run: python examples/quickstart.py

  jax:
    name: jax (parity with PyTorch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        run: uv pip install ".[test,jax]" --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Test
        run: pytest -q tests/test_jax.py
      - name: Quickstart
        run: python examples/quickstart_jax.py

  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        run: uv pip install -e . -r experiments/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Test
        working-directory: experiments
        run: pytest -q -m "not integration"
