name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  optimizer:
    name: optimizer (Python ${{ matrix.python }}, ${{ matrix.torch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported versions.
          - python: "3.9"
            torch: "torch==2.1.*"
          # Latest versions.
          - python: "3.13"
            torch: "torch"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install ".[test]" "${{ matrix.torch }}" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: pytest -q
      - name: Quickstart
        run: python examples/quickstart.py

  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        run: uv pip install -e . -r experiments/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        working-directory: experiments
        run: pytest -q -m "not integration"
