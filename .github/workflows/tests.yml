name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  optimizer:
    name: optimizer (Python ${{ matrix.python }}, torch ${{ matrix.torch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            torch: "2.1.*"
          - python: "3.12"
            torch: "*"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv pip install ".[test]" "torch==${{ matrix.torch }}" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: pytest -q
      - name: Quickstart
        run: python examples/quickstart.py

  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install -e . -r experiments/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        working-directory: experiments
        run: pytest -q -m "not integration"
