[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensorion"
version = "0.1.0"
description = "Muon for tensor layers: a drop-in Muon replacement with configurable tensor unfoldings."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy"]
keywords = ["pytorch", "optimizer", "muon", "tensor", "orthogonalization", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/MTML-LAB/Tensorion"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorion"]

[tool.hatch.build.targets.sdist]
include = ["src/tensorion", "tests", "examples", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
