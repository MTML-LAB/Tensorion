defaults:
  - datasets@dataset: food101
  - models@model: resnet18
  - optimizers@optimizer: adamw
  - schedulers@scheduler: cosinelr
  - criterions@criterion: ce
  - _self_

seed: 42
save_dir: "./results/exp1/${optimizer}_${dataset}"

loader_params:
  train_bs: 128
  test_bs: 512
  num_workers: 4

num_epochs: 150