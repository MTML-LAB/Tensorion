defaults:
  - dataset: cifar10
  - dataloader: default
  - model: resnet18
  - optimizer: tensorion
  - scheduler: noscheduler
  - criterion: ce
  - _self_

seed: 42
exp_name: unfolding_sweep
save_dir: "./results/${exp_name}/${hydra:runtime.choices.optimizer}_${to_str:${hydra:optimizer.projector.mode_idxs}}/lr=${optimizer.lr}"

num_epochs: 25

comet:
  enabled: true
  api_key: null
  workspace: null
  project_name: Tensorion
  experiment_name: opt=${hydra:runtime.choices.optimizer}_lr=${optimizer.lr}
  code_dir: ./src
  tags:
  - DualNorm
  - ${exp_name}
  - ${hydra:runtime.choices.model}
  - ${hydra:runtime.choices.dataset}
  - ${hydra:runtime.choices.optimizer}
  - ${hydra:runtime.choices.scheduler}
  - ${optimizer.projector.mode_idxs}
  offline: false
  offline_directory: "${save_dir}/comet_offline"
  log_code: true

hydra:
  sweep:
    dir: multirun/
    subdir: ${hydra:runtime.choices.optimizer}/lr=${optimizer.lr}/${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - seed
          - optimizer
          - optimizer.lr
          - comet.enabled
          - comet.api_key
          - comet.workspace
          - comet.project_name
          - comet.experiment_name
          - comet.tags
          - comet.offline
          - comet.offline_directory
          - comet.log_code
          - comet.code_dir
