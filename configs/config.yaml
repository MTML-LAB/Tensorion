defaults:
  - dataset: barcoded_mnist_bal
  - dataloader: default
  - model: resnet18
  - optimizer: adamw
  - scheduler: onecyclelr
  - criterion: ce
  - _self_

seed: 42
save_dir: "${hydra:runtime.output_dir}/results/"

num_epochs: 50

save_steps: -1

comet:
  # Enable/disable CometML logging
  enabled: true
  api_key: Um0P7ZJfSsUpck9nIdN89OaMy
  workspace: "xenomirant"
  
  project_name: "Tensorion"

  experiment_name: opt=${hydra:runtime.choices.optimizer}_model=${hydra:runtime.choices.model}_ds=${hydra:runtime.choices.dataset}
  
  # Tags for organizing experiments. Automatically includes model, dataset, optimizer, scheduler
  # Remove hardcoded tags and use only dynamic ones based on config choices
  tags: 
  - ${hydra:runtime.choices.model}
  - ${hydra:runtime.choices.dataset}
  - ${hydra:runtime.choices.optimizer}
  - ${hydra:runtime.choices.scheduler}
  
  # Offline mode: logs are saved locally and can be uploaded later.
  # Default behavior is ONLINE mode; set this to true explicitly if you want offline logging.
  offline: false
  # Directory where offline logs will be saved (relative to save_dir or absolute path)
  # Uses ${save_dir} which will be resolved dynamically from the config
  # If not specified, CometML will use its default offline directory
  offline_directory: "${save_dir}/comet_offline"
  log_code: false
  code_dir: null

hydra:
  sweep:
    dir: multirun/
    subdir: ${hydra:runtime.choices.optimizer}/lr=${optimizer.lr}/${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - seed
          - optimizer
          - optimizer.lr
          - comet.enabled
          - comet.api_key
          - comet.workspace
          - comet.project_name
          - comet.experiment_name
          - comet.tags
          - comet.offline
          - comet.offline_directory
          - comet.log_code
          - comet.code_dir
