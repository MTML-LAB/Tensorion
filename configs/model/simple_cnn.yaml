_target_: tensorion.models.simple_cnn._load_simple_cnn
in_channels: 3
num_classes: ${dataset.num_classes}
layers:
  - _target_: torch.nn.Conv2d
    in_channels: ${model.in_channels}
    out_channels: 32
    kernel_size: 5
    padding: 2
  - _target_: torch.nn.ReLU
  - _target_: torch.nn.MaxPool2d
    kernel_size: 2
    stride: 2
  - _target_: torch.nn.Conv2d
    in_channels: 32
    out_channels: 100
    kernel_size: 5
    padding: 2
  - _target_: torch.nn.ReLU
  - _target_: torch.nn.MaxPool2d
    kernel_size: 2
    stride: 2
  - _target_: torch.nn.Flatten
    start_dim: 1
  - _target_: torch.nn.Linear
    in_features: 4900
    out_features: ${model.num_classes}
